<title>Thiết Kế Thế Giới Khối</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Bố cục: thanh điều hướng trái + vùng nội dung; thẻ thực thể xếp lưới, chi tiết và ô chỉnh sửa nằm bên phải.
   Giao diện như bàn vẽ bản đồ của người dựng thế giới: nền xanh mực, nhấn xanh cỏ voxel, đồng thau cho số liệu. */
:root {
  --bg: #eef1f3; --panel: #ffffff; --panel2: #f4f6f8; --line: #d7dde3; --fg: #18212b; --dim: #5b6978; --faint: #8a96a3;
  --accent: #2f8a3a; --accent-fg: #ffffff; --accent-soft: #dff0e0; --brass: #96651a; --brass-soft: #f3e6cf;
  --ok: #2f8a3a; --review: #a96a00; --change: #2a6fc4; --remove: #b83232;
  --ok-soft: #dff0e0; --review-soft: #fbecc9; --change-soft: #dce9f9; --remove-soft: #f8dcdc;
  --f-display: 'Bricolage Grotesque', 'Be Vietnam Pro', system-ui, sans-serif; --f-body: 'Be Vietnam Pro', system-ui, sans-serif; --f-mono: 'JetBrains Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151c; --panel: #171f29; --panel2: #1d2733; --line: #2a3644; --fg: #e4e9ee; --dim: #9aa7b5; --faint: #6f7d8c;
  --accent: #8fd36a; --accent-fg: #0d1a08; --accent-soft: #1f3322; --brass: #e0b45a; --brass-soft: #34291a;
  --ok: #8fd36a; --review: #f0b445; --change: #7db3f2; --remove: #f08585;
  --ok-soft: #1f3322; --review-soft: #3a2f16; --change-soft: #1b2c44; --remove-soft: #3d2020; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f151c; --panel: #171f29; --panel2: #1d2733; --line: #2a3644; --fg: #e4e9ee; --dim: #9aa7b5; --faint: #6f7d8c;
  --accent: #8fd36a; --accent-fg: #0d1a08; --accent-soft: #1f3322; --brass: #e0b45a; --brass-soft: #34291a;
  --ok: #8fd36a; --review: #f0b445; --change: #7db3f2; --remove: #f08585;
  --ok-soft: #1f3322; --review-soft: #3a2f16; --change-soft: #1b2c44; --remove-soft: #3d2020; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 14px/1.55 var(--f-body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.2; }
h2 { font-size: 22px; } h3 { font-size: 16px; } h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-family: var(--f-body); font-weight: 600; }
p { margin: 0; } button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: 12px; }
.dim { color: var(--dim); } .faint { color: var(--faint); }

.shell { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 208px minmax(0, 1fr); gap: 24px; padding-block: 16px 48px; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; display: flex; flex-direction: column; gap: 4px; padding-top: 8px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.brand b { font-family: var(--f-display); font-size: 18px; line-height: 1.1; }
.brand small { display: block; color: var(--dim); font-size: 11px; font-weight: 400; }
.cube { width: 28px; height: 28px; background: linear-gradient(135deg, var(--accent) 0 50%, var(--brass) 50% 100%); border-radius: 4px; flex: none; }
.nav { display: flex; align-items: center; gap: 10px; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px; color: var(--dim); }
.nav:hover { background: var(--panel2); color: var(--fg); }
.nav[aria-current="page"] { background: var(--panel); color: var(--fg); box-shadow: inset 3px 0 0 var(--accent); font-weight: 500; }
.nav .n { margin-left: auto; font: 500 11px var(--f-mono); background: var(--review-soft); color: var(--review); padding: 1px 7px; border-radius: 10px; }
.sync { margin-top: 14px; padding: 10px; border: 1px dashed var(--line); border-radius: 6px; font-size: 12px; color: var(--dim); }
.main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; flex-wrap: wrap; align-items: end; gap: 8px 16px; justify-content: space-between; }
.page-head p { color: var(--dim); max-width: 70ch; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.card.flat { background: var(--panel2); }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.sp { justify-content: space-between; }

.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.tile:hover { border-color: var(--accent); }
.tile b { font: 700 26px var(--f-display); font-variant-numeric: tabular-nums; }
.tile span { color: var(--dim); font-size: 12px; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; padding: 1px 8px; border-radius: 10px; background: var(--panel2); color: var(--dim); border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; } .pill.review { background: var(--review-soft); color: var(--review); border-color: transparent; }
.pill.change { background: var(--change-soft); color: var(--change); border-color: transparent; } .pill.remove { background: var(--remove-soft); color: var(--remove); border-color: transparent; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px 2px 4px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); }
.chip img { width: 18px; height: 18px; image-rendering: pixelated; }
.chip.link { cursor: pointer; } .chip.link:hover { border-color: var(--accent); }
.sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #0003; display: inline-block; }

.field { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; resize: vertical; }
.field:focus { border-color: var(--accent); outline: none; }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; }
a.btn { color: var(--fg); text-decoration: none; display: inline-block; }
.stack > .pill { align-self: flex-start; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 500; }
.btn.sm { padding: 2px 8px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
.seg button { background: var(--panel2); border: 0; padding: 4px 10px; font-size: 12px; border-right: 1px solid var(--line); color: var(--dim); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 500; }
.seg button.s-review[aria-pressed="true"] { background: var(--review); color: #fff; } .seg button.s-change[aria-pressed="true"] { background: var(--change); color: #fff; } .seg button.s-remove[aria-pressed="true"] { background: var(--remove); color: #fff; }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 8px 14px; color: var(--dim); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }

.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 16px; align-items: start; }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
.ent { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; text-align: left; display: flex; flex-direction: column; gap: 4px; position: relative; }
.ent:hover { border-color: var(--accent); }
.ent[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.ent .img { aspect-ratio: 1; border-radius: 6px; background: var(--panel2); display: grid; place-items: center; overflow: hidden; }
.ent .img img { width: 100%; height: 100%; object-fit: cover; } .ent .img.px img { width: 56%; height: 56%; object-fit: contain; image-rendering: pixelated; }
.ent b { font-weight: 500; font-size: 13px; line-height: 1.25; } .ent small { color: var(--faint); font-size: 11px; }
.ent .dot { position: absolute; top: 8px; right: 8px; width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 2px var(--panel); }
.dot.review { background: var(--review); } .dot.change { background: var(--change); } .dot.remove { background: var(--remove); }
.detail { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 24px); overflow: auto; }
.hero-img { width: 112px; height: 112px; border-radius: 8px; background: var(--panel2); object-fit: cover; flex: none; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 13px; }
.kv dt { color: var(--dim); } .kv dd { margin: 0; font-family: var(--f-mono); font-size: 12px; min-width: 0; overflow-wrap: anywhere; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--dim); font-size: 12px; } th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.scroll-x { overflow-x: auto; }
.node { border-left: 3px solid var(--line); padding-left: 12px; }
.node.hasp { border-left-color: var(--change); }
.quote { background: var(--panel2); border-radius: 6px; padding: 8px 10px; }
.choice { font-size: 12px; color: var(--dim); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.flow { display: flex; flex-wrap: wrap; gap: 10px 6px; align-items: center; }
.flow .arrow { color: var(--faint); font: 500 12px var(--f-mono); display: flex; flex-direction: column; align-items: center; }
.rcard { border: 1px solid var(--line); border-left-width: 6px; border-radius: 8px; background: var(--panel); padding: 8px 12px; min-width: 150px; }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
.col { background: var(--panel2); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
.col h4 { display: flex; justify-content: space-between; }
.bcard { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.p1 { color: var(--remove); } .p2 { color: var(--review); } .p3 { color: var(--dim); }
.banner { padding: 8px 12px; border-radius: 6px; background: var(--review-soft); color: var(--review); font-size: 13px; }
pre.brief { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 12px; max-height: 360px; overflow: auto; white-space: pre-wrap; font: 12px/1.5 var(--f-mono); margin: 0; }
.savedot { font-size: 11px; color: var(--faint); min-height: 16px; }
.empty { color: var(--faint); padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: 8px; }
@media (max-width: 980px) { .shell { grid-template-columns: 1fr; gap: 12px; } .side { position: static; flex-direction: row; flex-wrap: wrap; align-items: center; } .brand { padding: 4px 8px; } .sync { display: none; } .split { grid-template-columns: 1fr; } .detail { position: static; max-height: none; } .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .board { grid-template-columns: 1fr; } .nav { padding: 6px 8px; } h2 { font-size: 19px; } }
@media (prefers-reduced-motion: no-preference) { .ent, .tile, .btn { transition: border-color .12s; } }
</style>

<div class="shell">
  <nav class="side" id="side" aria-label="Các phần của bảng thiết kế"></nav>
  <main class="main" id="main"></main>
</div>
<script type="application/json" id="snap">__SNAP__</script>
<script>
(() => {
'use strict';
const SNAP = JSON.parse(document.getElementById('snap').textContent);
const META = SNAP.meta || {};
const D = {
  region: Object.fromEntries(SNAP.regions.map(r => [r.id, r])), mob: SNAP.mobs, boss: SNAP.bosses, npc: SNAP.npcs, village: SNAP.villages,
  quest: SNAP.quests, item: SNAP.items,
};
const BOSS_MODEL = { 'thu-linh-soi': 'wolf-lord', 'bo-cap-chua': 'scorpion-queen', 'bang-de': 'ice-emperor', 'chua-dam-lay': 'swamp-king', 'vua-nham-thach': 'magma-king', 'ho-ve-pha-le': 'crystal-guardian' };
const TYPES = {
  region: { label: 'Vùng', file: 'content/regions.js' }, mob: { label: 'Quái', file: 'content/mobs.js' }, boss: { label: 'Boss', file: 'content/bosses.js' },
  npc: { label: 'NPC', file: 'content/npcs.js' }, village: { label: 'Làng', file: 'content/npcs.js (VILLAGES) và sim/structures.js' }, quest: { label: 'Nhiệm vụ', file: 'content/quests.js' },
  item: { label: 'Vật phẩm', file: 'content/items.js và content/recipes.js' }, dlg: { label: 'Lời thoại', file: 'content/npcs.js' },
};
const STATUS = { ok: 'Ổn', review: 'Cần xem lại', change: 'Cần sửa', remove: 'Đề xuất bỏ' };
const COL = { idea: 'Ý tưởng', planned: 'Đã duyệt', doing: 'Đang làm', done: 'Xong' };
const AREAS = ['Cốt truyện', 'Vùng', 'Quái', 'Boss', 'NPC & lời thoại', 'Nhiệm vụ', 'Vật phẩm & chế tạo', 'Xây dựng', 'Âm thanh', 'Đồ họa', 'Giao diện', 'Mạng', 'Cân bằng', 'Khác'];
const ENV_NAME = { heat: 'nóng', cold: 'lạnh', toxic: 'độc' };
const NAVS = [['overview', 'Tổng quan'], ['story', 'Cốt truyện & thế giới'], ['entities', 'Thực thể'], ['dialogue', 'Lời thoại'], ['quests', 'Nhiệm vụ'], ['items', 'Vật phẩm & chế tạo'], ['plan', 'Kế hoạch nâng cấp']];

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else if (k === 'style') n.style.cssText = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (k in n && k !== 'list') { try { n[k] = v; } catch (e) { n.setAttribute(k, v); } } else n.setAttribute(k, v);
  }
  for (const c of kids.flat(3)) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
};
const fmtTime = iso => { try { return new Date(iso).toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' }); } catch (e) { return ''; } };
const itemName = id => (D.item[id] && D.item[id].name) || id;
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem('gdd-' + k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('gdd-' + k, JSON.stringify(v)); } catch (e) { /* bỏ qua */ } } };

// ------------------------------------------------------------------ trạng thái và lưu trữ
const S = { view: store.get('view', 'overview'), etype: store.get('etype', 'mob'), eid: {}, npc: 'truong-lang', itemKind: 'all', recStation: 'all', entries: new Map(), backlog: new Map(), docs: {}, db: null, me: null, canWrite: true, ready: false, dbOff: false };
const keyOf = (t, id) => t + '__' + String(id).replace(/[^A-Za-z0-9_\-.~:@+]/g, '_');
const entry = (t, id) => S.entries.get(keyOf(t, id)) || null;
const statusOf = (t, id) => (entry(t, id) || {}).status || 'ok';
const chains = new Map();
function queueWrite(path, getData) {                    // mỗi tài liệu ghi lần lượt, luôn ghi trạng thái mới nhất
  if (!S.db) return Promise.resolve();
  const prev = chains.get(path) || Promise.resolve();
  const next = prev.then(() => S.db.doc(path).set(getData())).catch(e => { toast('Không lưu được: ' + (e && e.message || e)); }).then(() => { if (chains.get(path) === next) chains.delete(path); });
  chains.set(path, next); return next;
}
const blank = e => !e.note && !e.proposal && e.status === 'ok';
function saveEntry(t, id, name, patch) {
  const k = keyOf(t, id), cur = S.entries.get(k) || { type: t, id, name, status: 'ok', note: '', proposal: '', priority: 2 };
  const next = { ...cur, ...patch, name, updatedAt: new Date().toISOString(), updatedBy: S.me && S.me.id || null };
  S.entries.set(k, next);
  if (blank(next) && S.db) { S.entries.delete(k); const p = S.db.doc('entries/' + k); chains.set('del' + k, (chains.get('del' + k) || Promise.resolve()).then(() => p.delete()).catch(() => {})); }
  else queueWrite('entries/' + k, () => S.entries.get(k));
  refreshChrome();
}
function saveDoc(field, value) {
  S.docs = { ...S.docs, [field]: value, updatedAt: new Date().toISOString() };
  queueWrite('docs/overview', () => S.docs); refreshChrome();
}
function saveCard(id, patch) {
  const cur = S.backlog.get(id) || {}, next = { ...cur, ...patch, updatedAt: new Date().toISOString(), updatedBy: S.me && S.me.id || null };
  S.backlog.set(id, next); queueWrite('backlog/' + id, () => S.backlog.get(id)); render();
}
function newCard(data) {
  const id = 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  S.backlog.set(id, { title: '', desc: '', area: 'Khác', priority: 2, status: 'idea', refs: [], createdAt: new Date().toISOString(), ...data, updatedAt: new Date().toISOString(), updatedBy: S.me && S.me.id || null });
  queueWrite('backlog/' + id, () => S.backlog.get(id)); render();
}
function removeCard(id) { S.backlog.delete(id); if (S.db) S.db.doc('backlog/' + id).delete().catch(() => {}); render(); }
let toastT = null;
function toast(msg) { let t = $('#toast'); if (!t) { t = el('div', { id: 'toast', class: 'banner', style: 'position:fixed;right:16px;bottom:16px;z-index:9;max-width:320px;box-shadow:0 4px 18px #0004' }); document.body.append(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4000); }

// ------------------------------------------------------------------ thành phần dùng chung
const pill = (s) => el('span', { class: 'pill ' + s, text: STATUS[s] });
const itemChip = (id, n) => el('span', { class: 'chip link', title: itemName(id), onclick: () => go('item', id) }, SNAP.icons[id] ? el('img', { src: SNAP.icons[id], alt: '' }) : null, (n ? n + '× ' : '') + itemName(id));
const refChip = (t, id) => el('span', { class: 'chip link', style: 'padding-left:8px', onclick: () => go(t, id) }, (TYPES[t] ? TYPES[t].label + ': ' : '') + nameOf(t, id));
function nameOf(t, id) { if (t === 'dlg') return id; const o = D[t] && D[t][id]; return o ? o.name : id; }
const kv = rows => el('dl', { class: 'kv' }, rows.filter(r => r && r[1] != null && r[1] !== '').flatMap(([k, v]) => [el('dt', { text: k }), el('dd', {}, v)]));
const dropRows = drops => el('div', { class: 'row' }, (drops || []).map(d => el('span', { class: 'row', style: 'gap:4px' }, itemChip(d.item, d.min === d.max ? d.min : d.min + '–' + d.max), el('span', { class: 'faint mono', text: Math.round(d.p * 100) + '%' }))));
const regionChip = id => el('span', { class: 'chip link', style: 'padding-left:6px', onclick: () => go('region', id) }, el('i', { class: 'sw', style: `background:${(D.region[id] || {}).sky || '#888'}` }), nameOf('region', id));
const textarea = (value, onSave, { rows = 3, placeholder = '', id } = {}) => {
  const t = el('textarea', { class: 'field', rows, placeholder, id, value: value || '', disabled: !canEdit() });
  let timer = null, last = value || '';
  const flush = () => { clearTimeout(timer); if (t.value !== last) { last = t.value; onSave(t.value); } };
  t.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(flush, 800); });
  t.addEventListener('blur', flush);
  return t;
};
const canEdit = () => !S.dbOff && S.canWrite;

// Ô chỉnh sửa dùng chung: trạng thái, ghi chú, đề xuất thay đổi.
function editPanel(t, id, { label = 'Ghi chú thiết kế', proposalLabel = 'Đề xuất thay đổi (agent sẽ đọc để lập kế hoạch)' } = {}) {
  const e = entry(t, id) || { status: 'ok', note: '', proposal: '', priority: 2 }, name = nameOf(t, id);

const VIEWS = { overview: viewOverview, story: viewStory, entities: viewEntities, dialogue: viewDialogue, quests: viewQuests, items: viewItems, plan: viewPlan };
